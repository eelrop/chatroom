<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="chat.css">
  <style>
    body {
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #333;
    }
    h2 {
      text-align: center;
      color: gold;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: gold;
      color: black;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: orange; }
    .back-btn {
      margin-top: 10px;
      background: #444;
      color: white;
    }
    .back-btn:hover { background: #555; }
    .extra-btn {
      background: #4da6ff;
      color: white;
    }
    .extra-btn:hover { background: #3399ff; }
    .report-btn {
      background: #b30000;
      color: white;
    }
    .report-btn:hover { background: #e60000; }
    .help {
  display: inline-block;
  background-color: #32CD32;
  color: #fff;
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 5px rgba(50, 205, 50, 0.5);
  transition: background-color 0.2s ease;
}

.help:hover {
  background-color: #28a428;
}

  </style>
</head>
<body>

<div class="container">
  <h2>Account Settings</h2>

  <form id="accountForm">
    <label>Username:</label>
    <input type="text" id="username">

    <label>Email:</label>
    <input type="email" id="email">

    <label>New Password (leave blank to keep current):</label>
    <input type="password" id="password">

    <button type="submit">Update Account</button>
    <button type="button" class="help" onclick="window.open('guide.html', '_blank')">Chatroom User Guide</button>
    <button type="button" class="extra-btn" onclick="window.open('userpolicy.html', '_blank')">View User Policy</button>
    <button type="button" class="report-btn" onclick="window.open('report.html', '_blank')">Report Chatroom Abuse</button>
    <button type="button" class="back-btn" onclick="window.location.href='index.html'">Back to Chat</button>
  </form>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!user.username) {
    alert('You must be logged in to access account settings.');
    window.location.href = 'index.html';
  }

  const usernameInput = document.getElementById('username');
  const emailInput = document.getElementById('email');

  // Set initial values
  usernameInput.value = user.username;
  if (user.username === "Lee James") {
    usernameInput.readOnly = true;
  }

  // Load account details
  fetch(`/account/${encodeURIComponent(user.username)}`, {
    headers: { 'x-username': user.username }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      emailInput.value = data.email;
    } else {
      alert('Error loading account details.');
      window.location.href = 'index.html';
    }
  });

  // Update account details
  document.getElementById('accountForm').addEventListener('submit', e => {
    e.preventDefault();
    const newUsername = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const password = document.getElementById('password').value;

    fetch('/account/update', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-username': user.username
      },
      body: JSON.stringify({ username: user.username, newUsername, email, password })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message || 'Update complete');
      if (data.success) {
        // Update local storage and reload
        const updatedUser = { username: data.username || newUsername, role: user.role };
        localStorage.setItem('user', JSON.stringify(updatedUser));
        sessionStorage.setItem('updatedUser', JSON.stringify(updatedUser));
        window.location.href = 'index.html';
      }
    });
  });
</script>

</body>
</html>
