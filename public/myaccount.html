<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="myaccount.css">
</head>
<body>

<div class="container">
  <h2>My Account</h2>

  <div id="profileCircle" class="profile-image initials-circle">?</div>
  <img id="profilePreview" class="profile-image" src="" alt="Profile" style="display:none;">

<form id="accountForm">
  <label>Change Profile Picture:</label>
  <input type="file" accept="image/*" id="profilePicInput">

  <label>Username:</label>
  <input type="text" id="username">

  <label>Email:</label>
  <input type="email" id="email">

  <label>New Password:</label>
  <input type="password" id="password" placeholder="Leave blank to keep current">

  <div class="status" id="userRole"></div>

  <button type="submit">Update Account</button>
</form>


  <button class="link-btn" onclick="window.open('guide.html', '_blank')">Chatroom Guide</button>
  <button class="policy-btn" onclick="window.open('userpolicy.html', '_blank')">User Policy</button>
  <button class="report-btn" onclick="window.open('report.html', '_blank')">Report Chatroom Abuse</button>
  <button class="back-btn" onclick="window.location.href='index.html'">Back to Chat</button>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!user.username) {
    alert('You must be logged in to access account settings.');
    window.location.href = 'index.html';
  }

  const usernameInput = document.getElementById('username');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const profileInput = document.getElementById('profilePicInput');
  const preview = document.getElementById('profilePreview');
  const profileCircle = document.getElementById('profileCircle');
  const roleBox = document.getElementById('userRole');

  let base64Image = null;

  // Display user role with color
  const roleText = user.role.toUpperCase();
  let roleColor = '#ccc';
  if (user.role === 'admin') roleColor = '#FFD700';
  else if (user.role === 'moderator') roleColor = '#FF4500';
  else if (user.role === 'user') roleColor = '#32CD32';
  roleBox.innerHTML = `Your Status: <span style="color: ${roleColor}; font-weight: bold;">${roleText}</span>`;

  // Load initial values
  usernameInput.value = user.username;
  if (user.username === "Lee James") usernameInput.readOnly = true;

  fetch(`/account/${encodeURIComponent(user.username)}`)
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        emailInput.value = data.email;
        if (data.photo) {
          preview.src = data.photo;
          preview.style.display = 'block';
          profileCircle.style.display = 'none';
        } else {
          const initials = user.username
            .split(' ')
            .map(w => w[0])
            .join('')
            .slice(0, 2)
            .toUpperCase();
          profileCircle.textContent = initials;
          profileCircle.style.display = 'flex';
          preview.style.display = 'none';
        }
      } else {
        alert('Error loading account details.');
        window.location.href = 'index.html';
      }
    });

  profileInput.addEventListener('change', () => {
    const file = profileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      base64Image = reader.result;
      preview.src = base64Image;
      preview.style.display = 'block';
      profileCircle.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

document.getElementById('accountForm').addEventListener('submit', async e => {
  e.preventDefault();
  const newUsername = usernameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  const updateRes = await fetch('/account/update', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-username': user.username
    },
    body: JSON.stringify({ username: user.username, newUsername, email, password })
  });

  const updateData = await updateRes.json();
  if (!updateData.success) return alert(updateData.message || 'Update failed');

  // ? Upload photo if selected
  if (profileInput.files[0]) {
    const formData = new FormData();
    formData.append('photo', profileInput.files[0]);

    await fetch('/account/photo', {
      method: 'POST',
      headers: { 'x-username': newUsername },
      body: formData
    });
  }

  alert('Account updated successfully!');
  localStorage.setItem('user', JSON.stringify({ username: updateData.username, role: user.role }));
  window.location.href = 'index.html';
});

</script>

</body>
</html>
